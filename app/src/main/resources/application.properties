spring.application.name=restaurant-app
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.profiles.default=local
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurant_db}
spring.datasource.username=${DB_USER:restaurant_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]

payment.simulator.base-url=${PAYMENT_SIMULATOR_BASE_URL:http://127.0.0.1:8090}
payment.simulator.connect-timeout-ms=${PAYMENT_SIMULATOR_CONNECT_TIMEOUT_MS:500}
payment.simulator.read-timeout-ms=${PAYMENT_SIMULATOR_READ_TIMEOUT_MS:1000}
payment.circuit-breaker.sliding-window-size=${PAYMENT_BREAKER_WINDOW_SIZE:4}
payment.circuit-breaker.minimum-calls=${PAYMENT_BREAKER_MINIMUM_CALLS:2}
payment.circuit-breaker.failure-threshold=${PAYMENT_BREAKER_FAILURE_THRESHOLD:50}
payment.circuit-breaker.open-wait-ms=${PAYMENT_BREAKER_OPEN_WAIT_MS:2000}
payment.circuit-breaker.half-open-calls=${PAYMENT_BREAKER_HALF_OPEN_CALLS:1}

